<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="32" height="32" rx="8" fill="url(#emeraldGrad)" />

  <!-- Fork & Knife Icon -->
  <g filter="url(#shadow)">
    <!-- Fork -->
    <path d="M10 7v4a1.5 1.5 0 0 0 1.5 1.5h0a1.5 1.5 0 0 0 1.5-1.5V7M11.5 12.5v11.5M10 7h3" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Knife -->
    <path d="M20 7v17M20 7c1.8 0 2.8 1.4 2.8 3.8s-.8 3.2-2.8 3.8" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- QA Checkmark Badge -->
  <circle cx="23.5" cy="8.5" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1.2" />
  <path d="M21.5 8.5l1.3 1.3 2.5-2.5" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
